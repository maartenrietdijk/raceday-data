name: Fetch Standings

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Motorsport.com standings URL'
        required: true
      series:
        description: 'Series ID (e.g. f1, motogp, wec)'
        required: true

concurrency:
  group: raceday-data-writes-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Fetch standings
        run: |
          python fetch_standings.py \
            --url "${{ github.event.inputs.url }}" \
            --series "${{ github.event.inputs.series }}"

      - name: Commit standings file
        run: |
          git config user.name "RaceDay Bot"
          git config user.email "bot@raceday.app"
          git add '*_standings_2026.json'
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "standings: update ${{ github.event.inputs.series }} from motorsport.com"
            git pull --rebase origin main
            git push origin main
          fi
