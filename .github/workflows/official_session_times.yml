name: Scan Official Session Times
run-name: Session times · ${{ inputs.series || 'all' }} · ${{ inputs.event || 'automatic' }}

on:
  workflow_dispatch:
    inputs:
      series:
        description: 'Optional RaceDay series id (including supercars, sf, supergt and f1academy); empty scans every in-scope TBC series'
        required: false
        type: string
      event:
        description: 'Optional exact RaceDay event id'
        required: false
        type: string
      include_filled:
        description: 'Debug: compare already-filled sessions without making them actionable'
        required: false
        default: false
        type: boolean
      replace_filled:
        description: 'Event scan: replace filled sessions when official times changed'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - official_schedule_scanner.py
      - bsb_fd_schedule.py
      - session-time-sources.json
      - proposal-logic.js
      - raceday-editor.html
      - tests/**
      - .github/workflows/official_session_times.yml
  schedule:
    # Three checks per week. The scanner is idempotent and never edits calendars.
    # Monday after 12:00 Europe/Amsterdam in both summer and winter.
    - cron: '17 11 * * 1'
    - cron: '17 6 * * 3,5'

concurrency:
  group: raceday-data-writes-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout latest data
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install official-source readers
        run: python -m pip install --disable-pip-version-check pypdf==6.10.0 curl_cffi==0.16.3

      - name: Verify schedule test files are present
        run: |
          python - <<'PY_CHECK'
          from pathlib import Path
          required = ['tests/__init__.py', 'tests/fixtures/calendars/bsb_2026.json', 'tests/fixtures/calendars/fd_2026.json', 'tests/fixtures/calendars/elms_2026.json', 'tests/fixtures/calendars/elms_2027.json', 'tests/fixtures/calendars/24hseries_2026.json', 'tests/fixtures/calendars/24hseries_2027.json', 'tests/fixtures/calendars/dtm_2026.json', 'tests/fixtures/calendars/supercars_2026.json', 'bsb_fd_schedule.py', 'tests/test_bsb_fd_schedule.py', 'tests/fixtures/bsb_fd/bsb-calendar.html', 'tests/fixtures/bsb_fd/long-beach2-proposals.json', 'tests/test_elms_schedule.py', 'tests/fixtures/elms/sources.json', 'tests/fixtures/elms/barcelona.pdf', 'tests/fixtures/elms/2491.txt', 'tests/test_24hseries_schedule.py', 'tests/fixtures/24hseries/michelin-24h-kyalami-2027.html', '24hseries_2027.json', 'tests/test_schedule_reliability.py', 'tests/test_session_aliases.py', 'tests/test_editor_reliability.cjs', 'tests/test_editor_proposals.cjs', 'tests/test_editor_cancelled.cjs', 'tests/test_japanese_schedules.py', 'tests/test_f1academy_schedule.py', 'tests/test_formula1_schedule.py', 'tests/fixtures/japanese/sources.json', 'tests/fixtures/f1academy/sources.json', 'tests/fixtures/formula1/bahrain.html', 'tests/fixtures/calendars/sf_2026.json', 'tests/fixtures/calendars/supergt_2026.json', 'tests/fixtures/calendars/f1academy_2026.json']
          missing = [name for name in required if not Path(name).is_file()]
          if missing:
              raise SystemExit('Upload the complete tests folder at repository root. Missing: ' + ', '.join(missing))
          misplaced = sorted(str(path) for path in Path('.').glob('test_*.py'))
          if misplaced:
              print('Test files belong under tests/. Root copies can be removed: ' + ', '.join(misplaced))
          PY_CHECK

      - name: Set up Node for editor tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test schedule readers and proposal safety
        run: |
          python -m unittest discover -s tests -t . -p 'test_*.py' -v
          node tests/test_editor_proposals.cjs
          node tests/test_editor_reliability.cjs
          node tests/test_editor_cancelled.cjs

      - name: Scan official schedules
        shell: bash
        run: |
          args=()
          if [ -n "${{ inputs.series }}" ]; then
            args+=(--series "${{ inputs.series }}")
          fi
          if [ -n "${{ inputs.event }}" ]; then
            args+=(--event "${{ inputs.event }}")
          fi
          if [ "${{ inputs.include_filled }}" = "true" ]; then
            args+=(--include-filled)
          fi
          if [ "${{ inputs.replace_filled }}" = "true" ]; then
            args+=(--replace-filled)
          fi
          python official_schedule_scanner.py "${args[@]}"

      - name: Commit proposal store only
        env:
          SCAN_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "RaceDay Bot"
          git config user.email "bot@raceday.app"
          git add .raceday/session-time-proposals.json
          if git diff --staged --quiet; then
            echo "Official schedules are unchanged"
            exit 0
          fi
          git commit -m "Schedule: refresh official session-time proposals"
          git pull --rebase origin "$SCAN_BRANCH"
          git push origin "HEAD:$SCAN_BRANCH"
