name: Scan Official Session Times

on:
  workflow_dispatch:
    inputs:
      series:
        description: 'Optional RaceDay series id; empty scans every in-scope TBC series'
        required: false
        type: string
      event:
        description: 'Optional exact RaceDay event id'
        required: false
        type: string
  schedule:
    # Three checks per week. The scanner is idempotent and never edits calendars.
    - cron: '17 6 * * 1,3,5'

concurrency:
  group: raceday-data-writes-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout latest data
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF reader
        run: python -m pip install --disable-pip-version-check pypdf==6.10.0

      - name: Scan official schedules
        shell: bash
        run: |
          args=()
          if [ -n "${{ inputs.series }}" ]; then
            args+=(--series "${{ inputs.series }}")
          fi
          if [ -n "${{ inputs.event }}" ]; then
            args+=(--event "${{ inputs.event }}")
          fi
          python official_schedule_scanner.py "${args[@]}"

      - name: Commit proposal store only
        run: |
          git config user.name "RaceDay Bot"
          git config user.email "bot@raceday.app"
          git add .raceday/session-time-proposals.json
          if git diff --staged --quiet; then
            echo "Official schedules are unchanged"
            exit 0
          fi
          git commit -m "Schedule: refresh official session-time proposals"
          git pull --rebase origin main
          git push origin main
